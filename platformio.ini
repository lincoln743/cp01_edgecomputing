; ============================================================================
;  FrioLog - No de Borda Inteligente (Checkpoint 1 - Edge Computing - FIAP)
;  Placa: ESP32 DevKit v1 | Framework: Arduino | Simulacao: Wokwi
; ============================================================================
[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   = -DCORE_DEBUG_LEVEL=0

; Bibliotecas do sensor DHT22 (temperatura + umidade)
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
